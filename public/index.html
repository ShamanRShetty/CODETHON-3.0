<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultLink - Secure File Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <!-- Brand Logo / Badge -->
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 p-0.5 shadow-lg shadow-indigo-500/20 mb-4">
      <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
        <svg class="w-7 h-7 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
    </div>
    <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">VaultLink</h1>
    <p class="mt-2 text-sm text-slate-400">Share with a person, not just a link.</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900/80 backdrop-blur-xl py-8 px-4 shadow-2xl border border-slate-800/80 sm:rounded-2xl sm:px-10">
      <!-- Tabs -->
      <div class="flex border-b border-slate-800 mb-6">
        <button id="tab-login" class="flex-1 pb-3 text-center text-sm font-medium text-cyan-400 border-b-2 border-cyan-400 transition-colors">
          Sign In
        </button>
        <button id="tab-register" class="flex-1 pb-3 text-center text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-colors">
          Register
        </button>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

      <!-- Login Form -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-medium text-slate-300 mb-1">Email address</label>
          <input id="login-email" type="email" required autocomplete="email" class="w-full px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="you@example.com" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-medium text-slate-300 mb-1">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password" class="w-full px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="••••••••" />
        </div>

        <button type="submit" id="btn-login" class="w-full mt-2 py-2.5 px-4 rounded-lg bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-md shadow-cyan-500/20 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all">
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="register-name" class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
          <input id="register-name" type="text" required class="w-full px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="Alice Smith" />
        </div>

        <div>
          <label for="register-email" class="block text-xs font-medium text-slate-300 mb-1">Email address</label>
          <input id="register-email" type="email" required autocomplete="email" class="w-full px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="alice@example.com" />
        </div>

        <div>
          <label for="register-password" class="block text-xs font-medium text-slate-300 mb-1">Password (min. 8 characters)</label>
          <input id="register-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="••••••••" />
        </div>

        <button type="submit" id="btn-register" class="w-full mt-2 py-2.5 px-4 rounded-lg bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-md shadow-cyan-500/20 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all">
          Create Account
        </button>
      </form>
    </div>

    <!-- Security Footnote -->
    <div class="mt-6 text-center text-xs text-slate-500 space-y-1">
      <p>AES-256-GCM Envelope Encryption &bull; Ephemeral Recipient OTPs</p>
      <p>Zero plaintext storage &bull; Comprehensive Audit Logging</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authAlert = document.getElementById('auth-alert');

    function showAlert(msg, isError = true) {
      authAlert.textContent = msg;
      authAlert.className = `mb-4 p-3 rounded-lg text-xs font-medium border ${
        isError
          ? 'bg-rose-950/50 text-rose-300 border-rose-800'
          : 'bg-emerald-950/50 text-emerald-300 border-emerald-800'
      }`;
      authAlert.classList.remove('hidden');
    }

    function hideAlert() {
      authAlert.classList.add('hidden');
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 pb-3 text-center text-sm font-medium text-cyan-400 border-b-2 border-cyan-400 transition-colors';
      tabRegister.className = 'flex-1 pb-3 text-center text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-colors';
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
      hideAlert();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 pb-3 text-center text-sm font-medium text-cyan-400 border-b-2 border-cyan-400 transition-colors';
      tabLogin.className = 'flex-1 pb-3 text-center text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-colors';
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
      hideAlert();
    });

    // Check if already logged in
    api.get('/api/auth/me')
      .then((user) => {
        if (user && user.id) {
          window.location.href = '/files.html';
        }
      })
      .catch(() => {
        // Not authenticated; remain on page
      });

    // Handle Login
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await api.post('/api/auth/login', { email, password });
        UI.showToast('Login successful!', 'success');
        setTimeout(() => { window.location.href = '/files.html'; }, 300);
      } catch (err) {
        showAlert(err.message || 'Login failed', true);
      }
    });

    // Handle Registration
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      try {
        await api.post('/api/auth/register', { name, email, password });
        // Automatically log in after register
        await api.post('/api/auth/login', { email, password });
        UI.showToast('Account registered successfully!', 'success');
        setTimeout(() => { window.location.href = '/files.html'; }, 300);
      } catch (err) {
        showAlert(err.message || 'Registration failed', true);
      }
    });
  </script>
</body>
</html>
