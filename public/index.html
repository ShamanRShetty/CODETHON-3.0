<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoVo - Secure File Sharing</title>
  <script>
    // Theme immediate sync before render
    (function () {
      const saved = localStorage.getItem('movo_theme') || localStorage.getItem('vaultlink_theme') || 'dark';
      if (saved === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50 dark:bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] dark:from-slate-900 dark:via-slate-950 dark:to-black text-slate-900 dark:text-slate-100 transition-colors duration-200">
  
  <!-- Top Right Theme Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button type="button" class="theme-toggle-btn p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-cyan-600 dark:hover:text-cyan-400 shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-cyan-500" title="Toggle Theme" aria-label="Toggle Theme">
      <svg class="theme-icon-sun w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <svg class="theme-icon-moon w-4 h-4 block dark:hidden text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.03 9.03 0 008.354-5.646z"/>
      </svg>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <!-- Brand Logo -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white p-2 shadow-xl border border-slate-200 dark:border-slate-800 mb-4 animate-subtle-pulse">
      <img src="/MoVo.jpeg" alt="MoVo Official Logo" class="w-full h-full object-contain" />
    </div>
    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white sm:text-4xl">MoVo</h1>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-400 font-medium">Share with a person, not just a link.</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white/90 dark:bg-slate-900/80 backdrop-blur-xl py-8 px-5 sm:px-10 shadow-2xl border border-slate-200/80 dark:border-slate-800/80 rounded-2xl transition-all">
      <!-- Tabs -->
      <div class="flex border-b border-slate-200 dark:border-slate-800 mb-6">
        <button id="tab-login" class="flex-1 pb-3 text-center text-sm font-semibold text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 transition-all">
          Sign In
        </button>
        <button id="tab-register" class="flex-1 pb-3 text-center text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 border-b-2 border-transparent transition-all">
          Register
        </button>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold border transition-all"></div>

      <!-- Login Form -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email address</label>
          <input id="login-email" type="email" required autocomplete="email" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="you@example.com" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="••••••••" />
        </div>

        <button type="submit" id="btn-login" class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 via-indigo-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/30 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 dark:focus:ring-offset-slate-900 transition-all">
          Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="register-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Full Name</label>
          <input id="register-name" type="text" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="Alice Smith" />
        </div>

        <div>
          <label for="register-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email address</label>
          <input id="register-email" type="email" required autocomplete="email" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="alice@example.com" />
        </div>

        <div>
          <label for="register-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password (min. 8 characters)</label>
          <input id="register-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all" placeholder="••••••••" />
        </div>

        <button type="submit" id="btn-register" class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 via-indigo-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-sm font-semibold shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/30 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 dark:focus:ring-offset-slate-900 transition-all">
          Create Account
        </button>
      </form>
    </div>

    <!-- Security Footnote -->
    <div class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1">
      <p class="font-medium">AES-256-GCM Envelope Encryption &bull; Ephemeral Recipient OTPs</p>
      <p class="text-slate-400 dark:text-slate-500">Zero plaintext storage &bull; Comprehensive Audit Logging</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authAlert = document.getElementById('auth-alert');

    function showAlert(msg, isError = true) {
      authAlert.textContent = msg;
      authAlert.className = `mb-5 p-3.5 rounded-xl text-xs font-semibold border ${
        isError
          ? 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-800'
          : 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800'
      }`;
      authAlert.classList.remove('hidden');
    }

    function hideAlert() {
      authAlert.classList.add('hidden');
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 pb-3 text-center text-sm font-semibold text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 transition-all';
      tabRegister.className = 'flex-1 pb-3 text-center text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 border-b-2 border-transparent transition-all';
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
      hideAlert();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 pb-3 text-center text-sm font-semibold text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 transition-all';
      tabLogin.className = 'flex-1 pb-3 text-center text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 border-b-2 border-transparent transition-all';
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
      hideAlert();
    });

    // Check if already logged in
    api.get('/api/auth/me')
      .then((user) => {
        if (user && user.id) {
          window.location.href = '/files.html';
        }
      })
      .catch(() => {
        // Not authenticated; remain on page
      });

    // Handle Login
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await api.post('/api/auth/login', { email, password });
        UI.showToast('Login successful!', 'success');
        setTimeout(() => { window.location.href = '/files.html'; }, 300);
      } catch (err) {
        showAlert(err.message || 'Login failed', true);
      }
    });

    // Handle Registration
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      try {
        await api.post('/api/auth/register', { name, email, password });
        // Automatically log in after register
        await api.post('/api/auth/login', { email, password });
        UI.showToast('Account registered successfully!', 'success');
        setTimeout(() => { window.location.href = '/files.html'; }, 300);
      } catch (err) {
        showAlert(err.message || 'Registration failed', true);
      }
    });
  </script>
</body>
</html>
